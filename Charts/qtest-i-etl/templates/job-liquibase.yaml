{{ if .Values.liquibase.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: i-etl-liquibase-migrate-old
  namespace: {{ .Values.namespace.name }}
  annotations:
    {{- $migrateOldAnns := mustMergeOverwrite (dict) (.Values.liquibase.annotations | default dict) (dict "helm.sh/hook-weight" "-2") }}
    {{- toYaml $migrateOldAnns | nindent 4 }}
spec:
  template:
    metadata:
      name: i-etl-liquibase-migrate-old
      labels:
        chart: {{ include "qtest-insights-i-etl.chart" . }}
        release: {{ .Release.Name }}
        heritage: {{ .Release.Service }}
    spec:
      {{- if .Values.liquibase.securityContext }}
      securityContext: {{- toYaml .Values.liquibase.securityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate-old
          image: "{{ .Values.liquibase.image.repository }}:{{ .Values.liquibase.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.liquibase.image.pullPolicy }}
          args:
            - update
            - "-Detl_schema=insights_etl"
            - "-Dqtest_schema={{ .Values.qTestInsightsIEtl.qTestDBSchema }}"
            - "-Dinsights_schema={{ .Values.qTestInsightsIEtl.insightsDBSchema }}"
            - "-Dinsights_user={{ .Values.qTestInsightsIEtl.insightsDBUser }}"
            - "-Dqtestschema.name={{ .Values.qTestInsightsIEtl.qTestDBSchema }}"
          resources:
            requests:
              memory: "0.5Gi"
              cpu: "0.25"
            limits:
              memory: "2Gi"
              cpu: "0.5"
          envFrom:
            - configMapRef:
                name: qtest-insights-i-etl-configmap
          env:
            - name: LIQUIBASE_COMMAND_CHANGELOG_FILE
              value: database/liquibase/changelog-master.xml
            - name: LIQUIBASE_COMMAND_USERNAME
              value: "{{ .Values.qTestInsightsIEtl.insightsDBUser }}"
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: insightsDbPassword
            - name: LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME
              value: "{{ .Values.qTestInsightsIEtl.insightsDBSchema }}"
            - name: LIQUIBASE_COMMAND_URL
              value: "jdbc:postgresql://{{ .Values.qTestInsightsIEtl.writeQTestDBHost }}:{{ .Values.qTestInsightsIEtl.writeQTestDBPort }}/{{ .Values.qTestInsightsIEtl.writeQTestDBName }}"
      restartPolicy: OnFailure
    {{ if .Values.imageCredentials.enabled }}
      {{ if .Values.imageCredentials.existingImageCredentials }}
      imagePullSecrets:
        - name: {{ .Values.imageCredentials.existingImageCredentials }}
      {{- end }}
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: i-etl-liquibase-job
  namespace: {{ .Values.namespace.name }}
  annotations:
    {{- $liquibaseJobAnns := mustMergeOverwrite (dict) (.Values.liquibase.annotations | default dict) (dict "helm.sh/hook-weight" "-1") }}
    {{- toYaml $liquibaseJobAnns | nindent 4 }}
spec:
  template:
    metadata:
      name: i-etl-liquibase-job
      labels:
        chart: {{ include "qtest-insights-i-etl.chart" . }}
        release: {{ .Release.Name }}
        heritage: {{ .Release.Service }}
    spec:
      {{- if .Values.liquibase.securityContext }}
      securityContext: {{- toYaml .Values.liquibase.securityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: qtestliquibase
          image: "{{ .Values.liquibase.image.repository }}:{{ .Values.liquibase.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.liquibase.image.pullPolicy }}
          args:
            - update
            - "-Detl_schema=insights_etl"
            - "-Dqtest_schema={{ .Values.qTestInsightsIEtl.qTestDBSchema }}"
            - "-Dinsights_schema={{ .Values.qTestInsightsIEtl.insightsDBSchema }}"
            - "-Dinsights_user={{ .Values.qTestInsightsIEtl.insightsDBUser }}"
            - "-Dqtestschema.name={{ .Values.qTestInsightsIEtl.qTestDBSchema }}"
          resources:
            requests:
              memory: "0.5Gi"
              cpu: "0.25"
            limits:
              memory: "2Gi"
              cpu: "0.5"
          envFrom:
            - configMapRef:
                name: qtest-insights-i-etl-configmap
          env:
            - name: LIQUIBASE_COMMAND_CHANGELOG_FILE
              value: db/changelog/changelog-master.yaml
            - name: LIQUIBASE_COMMAND_USERNAME
              value: "{{ .Values.qTestInsightsIEtl.writeQTestDBUser }}"
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: qtestDbPassword
            - name: LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME
              value: "insights_etl"
            - name: LIQUIBASE_COMMAND_URL
              value: "jdbc:postgresql://{{ .Values.qTestInsightsIEtl.writeQTestDBHost }}:{{ .Values.qTestInsightsIEtl.writeQTestDBPort }}/{{ .Values.qTestInsightsIEtl.writeQTestDBName }}"
      restartPolicy: OnFailure
    {{ if .Values.imageCredentials.enabled }}
      {{ if .Values.imageCredentials.existingImageCredentials }}
      imagePullSecrets:
        - name: {{ .Values.imageCredentials.existingImageCredentials }}
      {{- end }}
    {{- end }}
{{- end }}
